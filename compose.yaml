services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - festpass-db:/var/lib/postgresql/data
    networks:
      - backend-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: rishabh010904/fest-backend:1.0.0
    build:
      context: ./backend
      args:
        APP_VERSION: 1.0.0
    environment:
      REGNO: "257"
      APP_VERSION: "1.0.0"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-db

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "257:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-backend

networks:
  frontend-backend:
  backend-db:

volumes:
  festpass-db:
